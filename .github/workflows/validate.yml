name: Validate

on:
  push:
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch config manifests only
        run: git lfs pull --include="models/*/config.json" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts speciesnet_adapter.py tests
